name: Build HaloAntri APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        shell: bash
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build HaloAntri APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK output
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HaloAntri.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaloAntri-APK
          path: HaloAntri.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release delete v1.0-latest --yes --cleanup-tag || true
          gh release create v1.0-latest HaloAntri.apk \
            --title "HaloAntri APK (Siap Instal)" \
            --notes "Build otomatis HaloAntri. Ketuk HaloAntri.apk di bawah untuk mengunduh langsung di HP Android."
